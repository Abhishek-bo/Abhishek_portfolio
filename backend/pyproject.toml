[project]
name = "backend"
version = "0.1.0"
description = "AI backend for AbhishekOS portfolio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "groq>=0.31.0",
    "pydantic>=2.9.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.1"
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"